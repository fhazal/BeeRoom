# Builds the BeeRoom Docker image for amd64 and arm64 from main, tests it
# on both (arm64 emulated: it must start and serve the page as the node
# user), and only then pushes ghcr.io/fhazal/beeroom:edge. It runs next to
# the BeeIRCd image; see compose.yaml in the BeeIRCd repo.
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build and test each platform
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform linux/$arch -f deploy/docker/Dockerfile --load -t beeroom-smoke:$arch .
            bash deploy/docker/smoke.sh beeroom-smoke:$arch linux/$arch
          done
          docker image ls beeroom-smoke
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: push ghcr.io/fhazal/beeroom:edge
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -f deploy/docker/Dockerfile --push \
            --label org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY} \
            --label org.opencontainers.image.description="BeeRoom web chat for BeeIRCd" \
            --label org.opencontainers.image.licenses=MIT \
            -t ghcr.io/fhazal/beeroom:edge -t ghcr.io/fhazal/beeroom:sha-${GITHUB_SHA::7} .
